name: Build official 1.1.0 APK

on:
  push:
    branches:
      - feature/background-dedup-timeouts
    paths:
      - .github/workflows/build-official-1.1.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/background-dedup-timeouts
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate version and release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 2' app/build.gradle.kts
          grep -q 'versionName = "1.1.0"' app/build.gradle.kts
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Restore official release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/drive-time-release.jks"
          chmod 600 "$RUNNER_TEMP/drive-time-release.jks"

      - name: Clean, test and lint
        run: gradle clean test lint --stacktrace

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/drive-time-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify signature and package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='app/build/outputs/apk/release/app-release.apk'
          OUT="$RUNNER_TEMP/drive-time-notifier-1.1.0.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -f "$SOURCE"
          test -x "$APKSIGNER"
          cp "$SOURCE" "$OUT"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee "$RUNNER_TEMP/apksigner.txt"
          (cd "$RUNNER_TEMP" && sha256sum drive-time-notifier-1.1.0.apk > SHA256SUMS.txt)

      - name: Upload official signed APK
        uses: actions/upload-artifact@v4
        with:
          name: drive-time-notifier-v1.1.0-official
          path: |
            ${{ runner.temp }}/drive-time-notifier-1.1.0.apk
            ${{ runner.temp }}/SHA256SUMS.txt
            ${{ runner.temp }}/apksigner.txt
          if-no-files-found: error

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '3115a083'
          git config user.email '9198182+3115a083@users.noreply.github.com'
          git rm .github/workflows/build-official-1.1.0.yml
          git commit -m 'Remove one-time 1.1.0 signing workflow'
          git push origin HEAD:feature/background-dedup-timeouts
