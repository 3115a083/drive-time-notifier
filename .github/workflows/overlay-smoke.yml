name: Overlay device smoke test
on:
  pull_request:
    paths:
      - 'app/src/main/java/de/drivetime/notifier/sharing/**'
      - 'app/src/main/java/de/drivetime/notifier/ui/**'
      - 'app/src/androidTest/**'
      - '.github/workflows/overlay-smoke.yml'
      - '.github/scripts/verify-device.sh'
permissions:
  contents: read
jobs:
  overlay-device:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.6.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/verify-device.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: overlay-device-verification
          path: |
            overlay-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
