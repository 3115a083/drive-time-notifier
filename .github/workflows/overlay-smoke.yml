name: Overlay device smoke test
on:
  pull_request:
    paths:
      - 'app/src/main/java/de/drivetime/notifier/sharing/**'
      - 'app/src/main/java/de/drivetime/notifier/ui/**'
      - 'app/src/androidTest/**'
      - '.github/workflows/overlay-smoke.yml'
permissions:
  contents: read
jobs:
  overlay-device:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            test_status=0
            gradle connectedDebugAndroidTest --stacktrace || test_status=$?
            mkdir -p overlay-screenshots
            for file in overlay-light.png overlay-dark.png overlay-start-failure.png overlay-start-failure.xml; do
              adb pull /data/local/tmp/$file overlay-screenshots/ || true
            done
            exit "$test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-device-verification
          path: |
            overlay-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
