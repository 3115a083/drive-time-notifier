name: EV Charging Test Build

on:
  push:
    branches:
      - feature/ev-charging-test

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ev-charging-test
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Apply EV charging implementation
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/if count != 2:/if count != 3:/' .github/ev_charging_patch.py
          sed -i 's/expected 2 description builder calls/expected 3 description builder calls/' .github/ev_charging_patch.py
          python3 .github/ev_charging_patch.py
      - name: Remove one-shot helper files
        run: rm -f .github/ev_charging_patch.py .github/workflows/ev-charging-test.yml
      - name: Verify patch whitespace
        run: git diff --check
      - name: Test, lint and build
        run: gradle clean test lint assembleDebug assembleRelease --stacktrace
      - name: Upload parallel-installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drive-time-notifier-ev-charging-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add destination EV charging station support"
          git push origin HEAD:feature/ev-charging-test
