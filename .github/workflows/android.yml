name: Android CI

on:
  push:
    branches: [ main, feature/android-app, release/publish-ready-v1, feature/charging-stations-debug ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.6.0"

      - name: Clean, test, lint and build
        run: gradle clean dependencyInventory test lint assembleDebug assembleRelease --stacktrace

      - name: Upload dependency inventory and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            app/build/reports/dependency-inventory.tsv
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drive-time-notifier-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
