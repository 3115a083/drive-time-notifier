name: Android CI

on:
  push:
    branches: [ main, feature/android-app, release/publish-ready-v1 ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Clean, test, lint and build
        run: gradle clean test lint assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: drive-time-notifier-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
