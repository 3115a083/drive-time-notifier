name: Apply provider advanced settings v3

on:
  push:
    branches:
      - feature/background-dedup-timeouts

permissions:
  contents: write

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/background-dedup-timeouts
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Apply requested changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def repl(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Pattern not found: {label}")
              return text.replace(old, new, 1)

          # Swiping the processing notification no longer cancels work.
          p = Path("app/src/main/java/de/drivetime/notifier/automation/AutomationNotifier.kt")
          x = p.read_text()
          x = repl(
              x,
              ".setOngoing(false)\n            .setDeleteIntent(cancelPending)\n            .addAction(0, tr(language, \"Cancel\", \"Abbrechen\"), cancelPending)",
              ".setOngoing(false)\n            .addAction(0, tr(language, \"Cancel\", \"Abbrechen\"), cancelPending)",
              "processing notification deleteIntent"
          )
          p.write_text(x)

          # Per-provider timeout model and daily local request limits.
          p = Path("app/src/main/java/de/drivetime/notifier/data/SettingsStore.kt")
          s = p.read_text()
          s = s.replace("val google: LimitPeriod = LimitPeriod.MONTHLY,", "val google: LimitPeriod = LimitPeriod.DAILY,", 1)
          if "data class ProviderTimeouts(" not in s:
              pos = s.index("data class AppSettings(")
              s = s[:pos] + '''data class ProviderTimeouts(
              val valhalla: Int = 18,
              val openRouteService: Int = 18,
              val osrm: Int = 14,
              val graphHopper: Int = 18,
              val google: Int = 22,
              val here: Int = 18,
              val tomTom: Int = 16
          ) {
              fun forProvider(provider: RoutingProvider): Int = when (provider) {
                  RoutingProvider.VALHALLA -> valhalla
                  RoutingProvider.OPENROUTESERVICE -> openRouteService
                  RoutingProvider.OSRM -> osrm
                  RoutingProvider.GRAPHHOPPER -> graphHopper
                  RoutingProvider.GOOGLE -> google
                  RoutingProvider.HERE -> here
                  RoutingProvider.TOMTOM -> tomTom
              }

              fun withProvider(provider: RoutingProvider, value: Int): ProviderTimeouts = when (provider) {
                  RoutingProvider.VALHALLA -> copy(valhalla = value)
                  RoutingProvider.OPENROUTESERVICE -> copy(openRouteService = value)
                  RoutingProvider.OSRM -> copy(osrm = value)
                  RoutingProvider.GRAPHHOPPER -> copy(graphHopper = value)
                  RoutingProvider.GOOGLE -> copy(google = value)
                  RoutingProvider.HERE -> copy(here = value)
                  RoutingProvider.TOMTOM -> copy(tomTom = value)
              }
          }

          ''' + s[pos:]

          s = repl(
              s,
              "    val providerLimitPeriods: ProviderLimitPeriods = ProviderLimitPeriods(),\n    val fallbackProviderIds: List<String> = emptyList()",
              "    val providerLimitPeriods: ProviderLimitPeriods = ProviderLimitPeriods(),\n    val providerTimeoutSeconds: ProviderTimeouts = ProviderTimeouts(),\n    val fallbackProviderIds: List<String> = emptyList()",
              "AppSettings timeout property"
          )
          s = repl(
              s,
              "        val PERIOD_TOMTOM = stringPreferencesKey(\"period_tomtom\")\n        val FALLBACK_PROVIDERS = stringPreferencesKey(\"fallback_providers\")",
              "        val PERIOD_TOMTOM = stringPreferencesKey(\"period_tomtom\")\n        val TIMEOUT_VALHALLA = intPreferencesKey(\"timeout_valhalla_seconds\")\n        val TIMEOUT_ORS = intPreferencesKey(\"timeout_openrouteservice_seconds\")\n        val TIMEOUT_GOOGLE = intPreferencesKey(\"timeout_google_seconds\")\n        val TIMEOUT_HERE = intPreferencesKey(\"timeout_here_seconds\")\n        val TIMEOUT_GRAPHHOPPER = intPreferencesKey(\"timeout_graphhopper_seconds\")\n        val TIMEOUT_OSRM = intPreferencesKey(\"timeout_osrm_seconds\")\n        val TIMEOUT_TOMTOM = intPreferencesKey(\"timeout_tomtom_seconds\")\n        val FALLBACK_PROVIDERS = stringPreferencesKey(\"fallback_providers\")",
              "timeout preference keys"
          )

          load_start = s.index("            providerLimitPeriods = ProviderLimitPeriods(")
          load_end = s.index("            fallbackProviderIds =", load_start)
          s = s[:load_start] + '''            providerLimitPeriods = ProviderLimitPeriods(),
              providerTimeoutSeconds = ProviderTimeouts(
                  valhalla = (p[K.TIMEOUT_VALHALLA] ?: 18).coerceIn(1, 300),
                  openRouteService = (p[K.TIMEOUT_ORS] ?: 18).coerceIn(1, 300),
                  osrm = (p[K.TIMEOUT_OSRM] ?: 14).coerceIn(1, 300),
                  graphHopper = (p[K.TIMEOUT_GRAPHHOPPER] ?: 18).coerceIn(1, 300),
                  google = (p[K.TIMEOUT_GOOGLE] ?: 22).coerceIn(1, 300),
                  here = (p[K.TIMEOUT_HERE] ?: 18).coerceIn(1, 300),
                  tomTom = (p[K.TIMEOUT_TOMTOM] ?: 16).coerceIn(1, 300)
              ),
          ''' + s[load_end:]

          period_pairs = [
              ("p[K.PERIOD_VALHALLA] = s.providerLimitPeriods.valhalla.id", "p[K.PERIOD_VALHALLA] = LimitPeriod.DAILY.id"),
              ("p[K.PERIOD_ORS] = s.providerLimitPeriods.openRouteService.id", "p[K.PERIOD_ORS] = LimitPeriod.DAILY.id"),
              ("p[K.PERIOD_GOOGLE] = s.providerLimitPeriods.google.id", "p[K.PERIOD_GOOGLE] = LimitPeriod.DAILY.id"),
              ("p[K.PERIOD_HERE] = s.providerLimitPeriods.here.id", "p[K.PERIOD_HERE] = LimitPeriod.DAILY.id"),
              ("p[K.PERIOD_GRAPHHOPPER] = s.providerLimitPeriods.graphHopper.id", "p[K.PERIOD_GRAPHHOPPER] = LimitPeriod.DAILY.id"),
              ("p[K.PERIOD_OSRM] = s.providerLimitPeriods.osrm.id", "p[K.PERIOD_OSRM] = LimitPeriod.DAILY.id"),
              ("p[K.PERIOD_TOMTOM] = s.providerLimitPeriods.tomTom.id", "p[K.PERIOD_TOMTOM] = LimitPeriod.DAILY.id")
          ]
          for old, new in period_pairs:
              s = repl(s, old, new, old)

          marker = "        p[K.PERIOD_TOMTOM] = LimitPeriod.DAILY.id\n"
          s = repl(
              s,
              marker,
              marker +
              "        p[K.TIMEOUT_VALHALLA] = sanitizeTimeout(s.providerTimeoutSeconds.valhalla)\n" +
              "        p[K.TIMEOUT_ORS] = sanitizeTimeout(s.providerTimeoutSeconds.openRouteService)\n" +
              "        p[K.TIMEOUT_GOOGLE] = sanitizeTimeout(s.providerTimeoutSeconds.google)\n" +
              "        p[K.TIMEOUT_HERE] = sanitizeTimeout(s.providerTimeoutSeconds.here)\n" +
              "        p[K.TIMEOUT_GRAPHHOPPER] = sanitizeTimeout(s.providerTimeoutSeconds.graphHopper)\n" +
              "        p[K.TIMEOUT_OSRM] = sanitizeTimeout(s.providerTimeoutSeconds.osrm)\n" +
              "        p[K.TIMEOUT_TOMTOM] = sanitizeTimeout(s.providerTimeoutSeconds.tomTom)\n",
              "timeout persistence"
          )
          s = repl(
              s,
              "    private fun sanitizeCap(value: Int) = value.coerceIn(1, 1_000_000)\n",
              "    private fun sanitizeCap(value: Int) = value.coerceIn(1, 1_000_000)\n    private fun sanitizeTimeout(value: Int) = value.coerceIn(1, 300)\n",
              "timeout sanitizer"
          )
          p.write_text(s)

          # Configured timeout applies to the provider currently being tried.
          p = Path("app/src/main/java/de/drivetime/notifier/routing/UnifiedRoutingService.kt")
          u = p.read_text()
          a = u.index("    private val client: OkHttpClient")
          b = u.index("\n\n    override suspend fun route", a)
          u = u[:a] + '''    private val timeoutSeconds = settings.providerTimeoutSeconds
                  .forProvider(settings.routingProvider)
                  .coerceIn(1, 300)
                  .toLong()
              private val client: OkHttpClient = OkHttpClient.Builder()
                  .connectTimeout(minOf(timeoutSeconds, 8L), TimeUnit.SECONDS)
                  .readTimeout(timeoutSeconds, TimeUnit.SECONDS)
                  .callTimeout(timeoutSeconds, TimeUnit.SECONDS)
                  .retryOnConnectionFailure(true)
                  .build()
          ''' + u[b:]
          a = u.index("    private fun readTimeoutSeconds(): Long")
          b = u.index("    private fun valhalla", a)
          u = u[:a] + u[b:]
          p.write_text(u)

          # Provider connectivity checks honor the same timeout and invalidate old health state when changed.
          p = Path("app/src/main/java/de/drivetime/notifier/routing/ProviderConnectivityChecker.kt")
          c = p.read_text()
          a = c.index("    private val client = OkHttpClient.Builder()")
          b = c.index("\n\n    suspend fun checkProvider", a)
          c = c[:a] + '''    private fun client(timeoutSeconds: Int): OkHttpClient {
                  val timeout = timeoutSeconds.coerceIn(1, 300).toLong()
                  return OkHttpClient.Builder()
                      .connectTimeout(minOf(timeout, 8L), TimeUnit.SECONDS)
                      .readTimeout(timeout, TimeUnit.SECONDS)
                      .callTimeout(timeout, TimeUnit.SECONDS)
                      .build()
              }
          ''' + c[b:]
          c = repl(c, "        execute(request, provider.displayName)\n", "        execute(request, provider.displayName, settings.providerTimeoutSeconds.forProvider(provider))\n", "provider checker timeout")
          c = repl(c, "    private fun execute(request: Request, label: String) {", "    private fun execute(request: Request, label: String, timeoutSeconds: Int = 12) {", "execute signature")
          c = repl(c, "        client.newCall(request).execute().use { response ->", "        client(timeoutSeconds).newCall(request).execute().use { response ->", "execute client")
          c = repl(c, 'return sha256("${provider.id}|$endpoint|$key")', 'return sha256("${provider.id}|$endpoint|$key|${settings.providerTimeoutSeconds.forProvider(provider)}")', "health fingerprint")
          p.write_text(c)

          # Remove the global 28-second manual routing budget so fallbacks can use their individual timeout.
          p = Path("app/src/main/java/de/drivetime/notifier/MainActivity.kt")
          m = p.read_text()
          a = m.index("                val result = withTimeoutOrNull(28_000) {")
          b = m.index("                loading = false", a)
          m = m[:a] + '''                val result = runCatching {
                      val route = RoutingServiceFactory.create(context, settings)
                          .route(RouteRequest(origin.trim(), destination.trim(), target))
                      val plan = DrivePlanner.plan(target, route.durationSeconds, settings.bufferMinutes, previousEndMillis)
                      val points = runCatching { PolylineDecoder.decode(route.encodedPolyline) }.getOrDefault(emptyList())
                      val routePois = if ((settings.showSpeedCameras || settings.showParking) && points.size >= 2) {
                          withTimeoutOrNull(13_000) {
                              OsmEnrichmentClient().query(points, settings.showSpeedCameras, settings.showParking)
                          }.orEmpty()
                      } else emptyList()
                      Triple(route, plan, routePois)
                  }
                  result.onSuccess { (route, plan, routePois) ->
                      estimate = route
                      plannedStart = plan.departureMillis
                      plannedEnd = plan.arrivalMillis
                      pois = routePois
                      val previousEnd = previousEndMillis
                      planConflict = previousEnd != null && plan.departureMillis < previousEnd
                      planWarning = listOfNotNull(
                          planWarningText(settings.language, plan, settings.bufferMinutes),
                          routeWarningText(settings.language, settings.routingProvider, route.warning)
                      ).joinToString(" ").ifBlank { null }
                  }.onFailure {
                      error = it.message ?: tr(settings.language, "Route calculation failed.", "Routenberechnung fehlgeschlagen.")
                  }
          ''' + m[b:]

          # Replace period callback with timeout callback in the provider list.
          anchor = m.index("                    ProviderCard(")
          a = m.index("                        onCap = { cap ->", anchor)
          b = m.index("                    )\n                    Spacer(Modifier.height(10.dp))", a)
          m = m[:a] + '''                        onCap = { cap ->
                              onChange(settings.copy(providerCaps = settings.providerCaps.withProvider(provider, cap)))
                          },
                          onTimeout = { seconds ->
                              onChange(
                                  settings.copy(
                                      providerTimeoutSeconds = settings.providerTimeoutSeconds.withProvider(provider, seconds)
                                  )
                              )
                          }
          ''' + m[b:]

          # Provider card advanced settings.
          card = m.index("    private fun ProviderCard(")
          a = m.index("        onSelect: () -> Unit,", card)
          b = m.index("        val key = keyStore.read(provider).orEmpty()", a)
          m = m[:a] + '''        onSelect: () -> Unit,
              onCap: (Int) -> Unit,
              onTimeout: (Int) -> Unit
          ) {
              val used = remember(provider, settings.providerCaps) {
                  RequestBudgetStore(this).used(provider, LimitPeriod.DAILY)
              }
              var advancedExpanded by rememberSaveable(provider.id) { mutableStateOf(false) }
          ''' + m[b:]

          desc = m.index("providerDescription(provider, settings.language)", card)
          a = m.index("                if (selected) {", desc)
          b = m.index("            }\n        }\n    }\n\n    @Composable\n    private fun InterfaceStatusIcon", a)
          m = m[:a] + '''                Spacer(Modifier.height(8.dp))
                  TextButton(
                      onClick = { advancedExpanded = !advancedExpanded },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Icon(
                          if (advancedExpanded) Icons.Outlined.ExpandLess else Icons.Outlined.ExpandMore,
                          contentDescription = null
                      )
                      Spacer(Modifier.width(6.dp))
                      Text(tr(settings.language, "Advanced", "Erweitert"))
                  }
                  if (advancedExpanded) {
                      NumberDraftField(
                          initialValue = settings.providerCaps.forProvider(provider),
                          label = tr(settings.language, "Daily request limit", "Tägliches Anfrage-Limit"),
                          onValid = { onCap(it.coerceIn(1, 1_000_000)) }
                      )
                      Spacer(Modifier.height(8.dp))
                      NumberDraftField(
                          initialValue = settings.providerTimeoutSeconds.forProvider(provider),
                          label = tr(settings.language, "Timeout in seconds", "Timeout in Sekunden"),
                          onValid = { onTimeout(it.coerceIn(1, 300)) }
                      )
                      Spacer(Modifier.height(6.dp))
                      Text(
                          tr(
                              settings.language,
                              "Used today: $used. The daily limit is a local hard stop. The timeout applies to each request to this provider and can be set from 1 to 300 seconds.",
                              "Heute genutzt: $used. Das Tageslimit ist ein lokaler harter Stopp. Der Timeout gilt für jede Anfrage an diesen Dienst und kann zwischen 1 und 300 Sekunden eingestellt werden."
                          ),
                          style = MaterialTheme.typography.bodySmall,
                          color = MaterialTheme.colorScheme.onSurfaceVariant
                      )
                  }
          ''' + m[b:]
          p.write_text(m)

          # Update model tests.
          p = Path("app/src/test/java/de/drivetime/notifier/data/ProviderDefaultsTest.kt")
          t = p.read_text().replace("assertEquals(LimitPeriod.MONTHLY, periods.google)", "assertEquals(LimitPeriod.DAILY, periods.google)", 1)
          if "providerTimeoutDefaultsAreServiceSpecific" not in t:
              pos = t.rfind("\n}")
              t = t[:pos] + '''

              @Test
              fun providerTimeoutDefaultsAreServiceSpecific() {
                  val timeouts = ProviderTimeouts()
                  assertEquals(16, timeouts.tomTom)
                  assertEquals(18, timeouts.valhalla)
                  assertEquals(18, timeouts.openRouteService)
                  assertEquals(14, timeouts.osrm)
                  assertEquals(18, timeouts.graphHopper)
                  assertEquals(22, timeouts.google)
                  assertEquals(18, timeouts.here)
              }
          ''' + t[pos:]
          p.write_text(t)
          PY

      - name: Verify and build debug APK
        run: gradle clean test lint assembleDebug --stacktrace

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-provider-advanced-settings.yml .github/workflows/apply-provider-advanced-settings-v3.yml
          git add app
          git commit -m "Add per-provider daily limits and timeout controls"
          git push origin HEAD:feature/background-dedup-timeouts

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drive-time-notifier-debug-provider-settings
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
