name: Apply Full Debug Feature

on:
  push:
    branches: [ feature/charging-stations-debug ]
    paths:
      - 'tools/apply_full_debug_feature.py'
      - '.github/workflows/apply-full-debug-feature.yml'

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply complete debug feature patch
        run: python tools/apply_full_debug_feature.py

      - name: Normalize update checker test JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/test/java/de/drivetime/notifier/update/UpdateCheckerTest.kt')
          text = path.read_text(encoding='utf-8')
          text = text.replace('\\\\"', '"')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit applied source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src
          if ! git diff --cached --quiet; then
            git commit -m 'Implement complete EV fixes dynamic buffer and updater'
            git push origin HEAD:feature/charging-stations-debug
          fi

      - name: Clean, test, lint and build
        run: gradle clean test lint assembleDebug assembleRelease --stacktrace

      - name: Upload full debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: drive-time-notifier-debug-full
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
