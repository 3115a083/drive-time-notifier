name: Apply shortcut import and health fixes

on:
  push:
    branches:
      - feature/background-dedup-timeouts

permissions:
  contents: write

jobs:
  patch-build-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/background-dedup-timeouts
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply requested changes
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/java/de/drivetime/notifier/automation/ShortcutActionActivity.kt <<'EOF'
          package de.drivetime.notifier.automation

          import android.app.Activity
          import android.os.Bundle
          import de.drivetime.notifier.MainActivity

          class ShortcutActionActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  when (intent?.action) {
                      AutomationReceiver.ACTION_PROCESS_NEXT_DAY -> AutomationScheduler.runNow(this)
                      MainActivity.ACTION_NEXT_DRIVE -> AutomationScheduler.runNextDriveNow(this)
                  }
                  finish()
              }
          }
          EOF

          cat > app/src/main/java/de/drivetime/notifier/automation/NextDriveWorker.kt <<'EOF'
          package de.drivetime.notifier.automation

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import androidx.core.content.ContextCompat
          import androidx.work.Constraints
          import androidx.work.CoroutineWorker
          import androidx.work.ExistingWorkPolicy
          import androidx.work.NetworkType
          import androidx.work.OneTimeWorkRequestBuilder
          import androidx.work.WorkManager
          import androidx.work.WorkerParameters
          import androidx.work.workDataOf
          import de.drivetime.notifier.calendar.CalendarRepository
          import de.drivetime.notifier.calendar.DriveEntryIdentity
          import de.drivetime.notifier.data.SettingsStore
          import de.drivetime.notifier.data.excludesLocation
          import de.drivetime.notifier.data.startLocationForCalendar
          import kotlinx.coroutines.flow.first

          class NextDriveWorker(
              appContext: Context,
              params: WorkerParameters
          ) : CoroutineWorker(appContext, params) {
              override suspend fun doWork(): Result {
                  val settings = SettingsStore(applicationContext).flow.first()
                  if (ContextCompat.checkSelfPermission(applicationContext, Manifest.permission.READ_CALENDAR) != PackageManager.PERMISSION_GRANTED) {
                      AutomationNotifier.notifyBackgroundActionProblem(
                          applicationContext,
                          settings.language,
                          "Calendar access is required for the next-drive action.",
                          "Für die Aktion „Nächste Fahrt“ wird Kalenderzugriff benötigt."
                      )
                      return Result.failure()
                  }

                  val sourceIds = settings.sourceCalendarIds.mapNotNull { it.toLongOrNull() }.toSet()
                  if (sourceIds.isEmpty()) {
                      AutomationNotifier.notifyBackgroundActionProblem(
                          applicationContext,
                          settings.language,
                          "Select at least one source calendar in Settings first.",
                          "Wähle zuerst mindestens einen Quellkalender in den Einstellungen."
                      )
                      return Result.failure()
                  }

                  val now = System.currentTimeMillis()
                  val calendar = CalendarRepository(applicationContext)
                  val events = runCatching {
                      calendar.events(
                          now - 24L * 60 * 60 * 1000,
                          now + 21L * 24 * 60 * 60 * 1000,
                          sourceIds
                      )
                  }.getOrElse {
                      AutomationNotifier.notifyBackgroundActionProblem(
                          applicationContext,
                          settings.language,
                          "The selected calendars could not be read.",
                          "Die ausgewählten Kalender konnten nicht gelesen werden."
                      )
                      return Result.retry()
                  }

                  val next = events.firstOrNull {
                      it.startMillis > now && !settings.excludesLocation(it.location)
                  }
                  if (next == null) {
                      AutomationNotifier.notifyBackgroundActionProblem(
                          applicationContext,
                          settings.language,
                          "No upcoming appointment with a routable location was found.",
                          "Kein kommender Termin mit routbarem Ort gefunden."
                      )
                      return Result.success()
                  }

                  val origin = settings.startLocationForCalendar(next.calendarId)
                  if (origin.isBlank()) {
                      AutomationNotifier.notifyBackgroundActionProblem(
                          applicationContext,
                          settings.language,
                          "No start location is configured for the next appointment.",
                          "Für den nächsten Termin ist kein Startort konfiguriert."
                      )
                      return Result.failure()
                  }

                  val previousEnd = events
                      .asSequence()
                      .filter { it.id != next.id && it.endMillis <= next.startMillis }
                      .maxOfOrNull { it.endMillis }
                  val identityKey = DriveEntryIdentity.key(next.location, next.startMillis)
                  val request = OneTimeWorkRequestBuilder<SingleEventWorker>()
                      .setInputData(
                          workDataOf(
                              "origin" to origin,
                              "destination" to next.location,
                              "arrival_millis" to next.startMillis,
                              "previous_end_millis" to (previousEnd ?: -1L),
                              "identity_key" to identityKey
                          )
                      )
                      .setConstraints(Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build())
                      .build()
                  WorkManager.getInstance(applicationContext).enqueueUniqueWork(
                      "shortcut-next-drive-route",
                      ExistingWorkPolicy.REPLACE,
                      request
                  )
                  return Result.success()
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing anchor: {label}")
              return text.replace(old, new, 1)

          # MainActivity
          p = Path('app/src/main/java/de/drivetime/notifier/MainActivity.kt')
          s = p.read_text()
          s = replace_once(s,
              'import androidx.compose.foundation.background\nimport androidx.compose.foundation.clickable\n',
              'import androidx.compose.foundation.background\nimport androidx.compose.foundation.clickable\nimport androidx.compose.foundation.gestures.detectTapGestures\n',
              'gesture import')
          s = replace_once(s,
              'import androidx.compose.ui.graphics.Brush\n',
              'import androidx.compose.ui.graphics.Brush\nimport androidx.compose.ui.input.pointer.pointerInput\n',
              'pointer import')

          old_oncreate = '''        super.onCreate(savedInstanceState)\n        enableEdgeToEdge()\n        Configuration.getInstance().userAgentValue = packageName\n        if (intent.action == AutomationReceiver.ACTION_PROCESS_NEXT_DAY) AutomationScheduler.runNow(this)\n\n        val settingsStore = SettingsStore(this)'''
          new_oncreate = '''        super.onCreate(savedInstanceState)\n        when (intent.action) {\n            AutomationReceiver.ACTION_PROCESS_NEXT_DAY -> {\n                AutomationScheduler.runNow(this)\n                finish()\n                return\n            }\n            ACTION_NEXT_DRIVE -> {\n                AutomationScheduler.runNextDriveNow(this)\n                finish()\n                return\n            }\n        }\n        enableEdgeToEdge()\n        Configuration.getInstance().userAgentValue = packageName\n\n        val settingsStore = SettingsStore(this)'''
          s = replace_once(s, old_oncreate, new_oncreate, 'shortcut fallback onCreate')

          state_anchor = '''        var pendingExportPassword by remember { mutableStateOf<String?>(null) }\n        var backupMessage by remember { mutableStateOf<String?>(null) }\n        var automationToken by remember { mutableStateOf(AutomationTokenStore(context).token()) }'''
          state_new = '''        var pendingExportPassword by remember { mutableStateOf<String?>(null) }\n        var backupMessage by remember { mutableStateOf<String?>(null) }\n        var showCalendarReselectionPrompt by remember { mutableStateOf(false) }\n        var calendarReselectionFlow by remember { mutableStateOf(false) }\n        var pendingImportedSettings by remember { mutableStateOf<AppSettings?>(null) }\n        var pendingReselectedSourceIds by remember { mutableStateOf<Set<String>>(emptySet()) }\n        var restoreAutomaticAfterCalendarSelection by remember { mutableStateOf(false) }\n        var automationToken by remember { mutableStateOf(AutomationTokenStore(context).token()) }'''
          s = replace_once(s, state_anchor, state_new, 'import states')

          old_import_launcher = '''        val importBackupLauncher = rememberLauncherForActivityResult(\n            ActivityResultContracts.OpenDocument()\n        ) { uri ->\n            if (uri != null) {\n                pendingImportUri = uri\n                backupPassword = ""\n                backupPasswordMode = "import"\n            }\n        }'''
          new_import_launcher = '''        val importBackupLauncher = rememberLauncherForActivityResult(\n            ActivityResultContracts.OpenDocument()\n        ) { uri ->\n            if (uri != null) {\n                scope.launch {\n                    val valid = withContext(Dispatchers.IO) {\n                        context.contentResolver.openInputStream(uri)?.use { PasswordBackup.hasValidHeader(it) } == true\n                    }\n                    if (valid) {\n                        pendingImportUri = uri\n                        backupPassword = ""\n                        backupPasswordMode = "import"\n                    } else {\n                        pendingImportUri = null\n                        backupMessage = tr(\n                            latestSettings.language,\n                            "The selected file is not a Drive Time Notifier backup.",\n                            "Die ausgewählte Datei ist kein Drive-Time-Notifier-Backup."\n                        )\n                    }\n                }\n            }\n        }'''
          s = replace_once(s, old_import_launcher, new_import_launcher, 'validated import launcher')

          s = replace_once(s,
              'importBackupLauncher.launch(arrayOf("application/octet-stream", "application/json", "*/*"))',
              'importBackupLauncher.launch(arrayOf("application/vnd.drivetime.notifier.backup", "application/octet-stream"))',
              'backup mime filter')

          old_success = '''                                        result.onSuccess { imported ->\n                                            imported.apiKeys.forEach { (provider, value) -> keyStore.save(provider, value) }\n                                            homeNameDraft = imported.settings.homeName\n                                            homeDraft = imported.settings.homeAddress\n                                            calendarTitleDraft = imported.settings.calendarEventTitle\n                                            osrmDraft = imported.settings.osrmBaseUrl\n                                            valhallaDraft = imported.settings.valhallaBaseUrl\n                                            photonDraft = imported.settings.photonBaseUrl\n                                            onChange(imported.settings)\n                                            healthRevision++\n                                            backupMessage = tr(\n                                                imported.settings.language,\n                                                "Backup imported. Review source and target calendars on this device.",\n                                                "Backup importiert. Prüfe Quell- und Zielkalender auf diesem Gerät."\n                                            )\n                                        }.onFailure {'''
          new_success = '''                                        result.onSuccess { imported ->\n                                            imported.apiKeys.forEach { (provider, value) -> keyStore.save(provider, value) }\n                                            val restored = imported.settings.copy(\n                                                sourceCalendarIds = emptySet(),\n                                                targetCalendarId = -1L,\n                                                calendarStartLocations = emptySet(),\n                                                automaticEnabled = false\n                                            )\n                                            homeNameDraft = restored.homeName\n                                            homeDraft = restored.homeAddress\n                                            calendarTitleDraft = restored.calendarEventTitle\n                                            osrmDraft = restored.osrmBaseUrl\n                                            valhallaDraft = restored.valhallaBaseUrl\n                                            photonDraft = restored.photonBaseUrl\n                                            pendingImportedSettings = restored\n                                            pendingReselectedSourceIds = emptySet()\n                                            restoreAutomaticAfterCalendarSelection = imported.settings.automaticEnabled\n                                            healthRevision++\n                                            backupMessage = null\n                                            showCalendarReselectionPrompt = true\n                                        }.onFailure {'''
          s = replace_once(s, old_success, new_success, 'safe import calendar reset')

          dialog_anchor = '''        if (showTargetPicker) {\n            CalendarSinglePicker('''
          reselection_dialog = '''        if (showCalendarReselectionPrompt) {\n            AlertDialog(\n                onDismissRequest = {},\n                title = { Text(tr(settings.language, "Select calendars again", "Kalender erneut festlegen")) },\n                text = {\n                    Text(\n                        tr(\n                            settings.language,\n                            "Calendar IDs are device-specific. Source calendars, target calendar and calendar-to-start-location assignments were intentionally not imported. Select the calendars on this device now. Automatic processing will be restored afterwards if it was enabled in the backup.",\n                            "Kalender-IDs sind gerätespezifisch. Quellkalender, Zielkalender und kalenderabhängige Startort-Zuordnungen wurden deshalb bewusst nicht übernommen. Lege die Kalender auf diesem Gerät jetzt neu fest. Die Automatik wird danach wieder aktiviert, falls sie im Backup aktiv war."\n                        )\n                    )\n                },\n                confirmButton = {\n                    Button(onClick = {\n                        showCalendarReselectionPrompt = false\n                        calendarReselectionFlow = true\n                        pendingReselectedSourceIds = emptySet()\n                        showSourcePicker = true\n                    }) {\n                        Text(tr(settings.language, "Select calendars", "Kalender festlegen"))\n                    }\n                }\n            )\n        }\n\n        if (showTargetPicker) {\n            CalendarSinglePicker('''
          s = replace_once(s, dialog_anchor, reselection_dialog, 'calendar reselection dialog')

          old_target = '''                settings, calendars, settings.targetCalendarId,\n                onDismiss = { showTargetPicker = false },\n                onSelect = { onChange(settings.copy(targetCalendarId = it)); showTargetPicker = false }'''
          new_target = '''                settings, calendars, if (calendarReselectionFlow) -1L else settings.targetCalendarId,\n                onDismiss = { if (!calendarReselectionFlow) showTargetPicker = false },\n                onSelect = { targetId ->\n                    if (calendarReselectionFlow) {\n                        val base = pendingImportedSettings ?: settings.copy(\n                            sourceCalendarIds = emptySet(),\n                            targetCalendarId = -1L,\n                            calendarStartLocations = emptySet(),\n                            automaticEnabled = false\n                        )\n                        onChange(\n                            base.copy(\n                                sourceCalendarIds = pendingReselectedSourceIds,\n                                targetCalendarId = targetId,\n                                automaticEnabled = restoreAutomaticAfterCalendarSelection\n                            )\n                        )\n                        pendingImportedSettings = null\n                        calendarReselectionFlow = false\n                        showTargetPicker = false\n                        backupMessage = tr(\n                            base.language,\n                            "Backup imported and calendars reassigned.",\n                            "Backup importiert und Kalender neu zugeordnet."\n                        )\n                    } else {\n                        onChange(settings.copy(targetCalendarId = targetId))\n                        showTargetPicker = false\n                    }\n                }'''
          s = replace_once(s, old_target, new_target, 'target reselection flow')

          old_source = '''                settings, calendars, settings.sourceCalendarIds,\n                onDismiss = { showSourcePicker = false },\n                onApply = { onChange(settings.copy(sourceCalendarIds = it)); showSourcePicker = false }'''
          new_source = '''                settings, calendars, if (calendarReselectionFlow) emptySet() else settings.sourceCalendarIds,\n                onDismiss = { if (!calendarReselectionFlow) showSourcePicker = false },\n                onApply = { selectedIds ->\n                    if (calendarReselectionFlow) {\n                        if (selectedIds.isNotEmpty()) {\n                            pendingReselectedSourceIds = selectedIds\n                            showSourcePicker = false\n                            showTargetPicker = true\n                        }\n                    } else {\n                        onChange(settings.copy(sourceCalendarIds = selectedIds))\n                        showSourcePicker = false\n                    }\n                }'''
          s = replace_once(s, old_source, new_source, 'source reselection flow')

          provider_call_anchor = '''                        interfaceHealthStore = interfaceHealthStore,\n                        healthRevision = healthRevision,\n                        onSelect = {'''
          provider_call_new = '''                        interfaceHealthStore = interfaceHealthStore,\n                        healthRevision = healthRevision,\n                        onHealthChanged = { healthRevision++ },\n                        onSelect = {'''
          s = replace_once(s, provider_call_anchor, provider_call_new, 'provider health callback')

          sig_old = '''        interfaceHealthStore: InterfaceHealthStore,\n        healthRevision: Int,\n        onSelect: () -> Unit,\n    onCap: (Int) -> Unit,'''
          sig_new = '''        interfaceHealthStore: InterfaceHealthStore,\n        healthRevision: Int,\n        onHealthChanged: () -> Unit,\n        onSelect: () -> Unit,\n    onCap: (Int) -> Unit,'''
          s = replace_once(s, sig_old, sig_new, 'provider card signature')

          local_old = '''    var advancedExpanded by rememberSaveable(provider.id) { mutableStateOf(false) }\n        val key = keyStore.read(provider).orEmpty()'''
          local_new = '''    var advancedExpanded by rememberSaveable(provider.id) { mutableStateOf(false) }\n        val scope = rememberCoroutineScope()\n        var statusTesting by remember(provider) { mutableStateOf(false) }\n        val key = keyStore.read(provider).orEmpty()'''
          s = replace_once(s, local_old, local_new, 'provider status testing state')

          icon_old = '''                    InterfaceStatusIcon(\n                        state = interfaceStatus,\n                        contentDescription = when (interfaceStatus) {\n                            InterfaceCheckState.VALID -> tr(\n                                settings.language,\n                                if (provider.keyRequired) "API key verified" else "Interface reachable",\n                                if (provider.keyRequired) "API-Key geprüft" else "Schnittstelle erreichbar"\n                            )\n                            InterfaceCheckState.INVALID -> tr(settings.language, "Interface/key check failed", "Schnittstellen-/Key-Prüfung fehlgeschlagen")\n                            InterfaceCheckState.UNKNOWN -> tr(settings.language, "Interface not checked", "Schnittstelle nicht geprüft")\n                        }\n                    )'''
          icon_new = '''                    if (statusTesting) {\n                        CircularProgressIndicator(modifier = Modifier.size(21.dp), strokeWidth = 2.dp)\n                    } else {\n                        InterfaceStatusIcon(\n                            state = interfaceStatus,\n                            contentDescription = when (interfaceStatus) {\n                                InterfaceCheckState.VALID -> tr(\n                                    settings.language,\n                                    if (provider.keyRequired) "API key verified" else "Interface reachable",\n                                    if (provider.keyRequired) "API-Key geprüft" else "Schnittstelle erreichbar"\n                                )\n                                InterfaceCheckState.INVALID -> tr(\n                                    settings.language,\n                                    "Interface/key check failed. Hold to test again.",\n                                    "Schnittstellen-/Key-Prüfung fehlgeschlagen. Zum erneuten Testen gedrückt halten."\n                                )\n                                InterfaceCheckState.UNKNOWN -> tr(settings.language, "Interface not checked", "Schnittstelle nicht geprüft")\n                            },\n                            modifier = if (interfaceStatus == InterfaceCheckState.INVALID) {\n                                Modifier.pointerInput(provider, interfaceStatus) {\n                                    detectTapGestures(onLongPress = {\n                                        if (!statusTesting) {\n                                            statusTesting = true\n                                            scope.launch {\n                                                ProviderConnectivityChecker(this@MainActivity, settings, keyStore, interfaceHealthStore)\n                                                    .checkProvider(provider)\n                                                statusTesting = false\n                                                onHealthChanged()\n                                            }\n                                        }\n                                    })\n                                }\n                            } else Modifier\n                        )\n                    }'''
          s = replace_once(s, icon_old, icon_new, 'long press provider test')

          interface_sig_old = '''    private fun InterfaceStatusIcon(state: InterfaceCheckState, contentDescription: String) {'''
          interface_sig_new = '''    private fun InterfaceStatusIcon(\n        state: InterfaceCheckState,\n        contentDescription: String,\n        modifier: Modifier = Modifier\n    ) {'''
          s = replace_once(s, interface_sig_old, interface_sig_new, 'status icon modifier signature')
          s = replace_once(s,
              '''            modifier = Modifier.size(21.dp)\n        )\n    }''',
              '''            modifier = modifier.size(21.dp)\n        )\n    }''',
              'status icon modifier use')

          p.write_text(s)

          # PasswordBackup: preflight header validation
          p = Path('app/src/main/java/de/drivetime/notifier/security/PasswordBackup.kt')
          s = p.read_text()
          anchor = '''    fun import(input: InputStream, password: CharArray): BackupImportResult {'''
          addition = '''    fun hasValidHeader(input: InputStream): Boolean {\n        val header = ByteArray(MAGIC.size)\n        var offset = 0\n        while (offset < header.size) {\n            val read = input.read(header, offset, header.size - offset)\n            if (read <= 0) return false\n            offset += read\n        }\n        return header.contentEquals(MAGIC)\n    }\n\n    fun import(input: InputStream, password: CharArray): BackupImportResult {'''
          s = replace_once(s, anchor, addition, 'backup header checker')
          p.write_text(s)

          # AutomationScheduler: background next-drive action
          p = Path('app/src/main/java/de/drivetime/notifier/automation/AutomationScheduler.kt')
          s = p.read_text()
          anchor = '''    private fun setRescheduleReceiverEnabled(context: Context, enabled: Boolean) {'''
          addition = '''    fun runNextDriveNow(context: Context) {\n        val request = OneTimeWorkRequestBuilder<NextDriveWorker>()\n            .setConstraints(Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build())\n            .build()\n        WorkManager.getInstance(context).enqueueUniqueWork(\n            "manual-next-drive-locator",\n            ExistingWorkPolicy.REPLACE,\n            request\n        )\n    }\n\n    private fun setRescheduleReceiverEnabled(context: Context, enabled: Boolean) {'''
          s = replace_once(s, anchor, addition, 'run next drive scheduler')
          p.write_text(s)

          # AutomationNotifier: errors for silent shortcuts
          p = Path('app/src/main/java/de/drivetime/notifier/automation/AutomationNotifier.kt')
          s = p.read_text()
          anchor = '''    fun cancelNotification(context: Context, notificationId: Int) {'''
          addition = '''    @SuppressLint("MissingPermission")\n    fun notifyBackgroundActionProblem(\n        context: Context,\n        language: AppLanguage,\n        english: String,\n        german: String\n    ) {\n        if (!canNotify(context)) return\n        createChannel(\n            context,\n            FAILURE_CHANNEL_ID,\n            tr(language, "Background action", "Hintergrundaktion"),\n            tr(language, "Problems while running a background app action.", "Probleme beim Ausführen einer Hintergrundaktion.")\n        )\n        val text = tr(language, english, german)\n        val openPending = PendingIntent.getActivity(\n            context,\n            text.hashCode(),\n            Intent(context, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP),\n            PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE\n        )\n        NotificationManagerCompat.from(context).notify(\n            70_000 + text.hashCode().absoluteValue % 10_000,\n            NotificationCompat.Builder(context, FAILURE_CHANNEL_ID)\n                .setSmallIcon(R.drawable.ic_notification)\n                .setContentTitle(tr(language, "Background action could not run", "Hintergrundaktion konnte nicht ausgeführt werden"))\n                .setContentText(text)\n                .setStyle(NotificationCompat.BigTextStyle().bigText(text))\n                .setPriority(NotificationCompat.PRIORITY_DEFAULT)\n                .setAutoCancel(true)\n                .setContentIntent(openPending)\n                .build()\n        )\n    }\n\n    fun cancelNotification(context: Context, notificationId: Int) {'''
          s = replace_once(s, anchor, addition, 'background action notification')
          p.write_text(s)

          # Manifest: invisible shortcut dispatcher
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          anchor = '''        <activity android:name=".MainActivity" android:exported="true">'''
          addition = '''        <activity\n            android:name=".automation.ShortcutActionActivity"\n            android:exported="true"\n            android:excludeFromRecents="true"\n            android:noHistory="true"\n            android:theme="@android:style/Theme.NoDisplay" />\n\n        <activity android:name=".MainActivity" android:exported="true">'''
          s = replace_once(s, anchor, addition, 'shortcut dispatcher manifest')
          p.write_text(s)

          # Static shortcuts: never target MainActivity
          for fn in ['app/src/main/res/xml/shortcuts.xml', 'app/src/debug/res/xml/shortcuts.xml']:
              p = Path(fn)
              s = p.read_text().replace(
                  'android:targetClass="de.drivetime.notifier.MainActivity"',
                  'android:targetClass="de.drivetime.notifier.automation.ShortcutActionActivity"'
              )
              p.write_text(s)
          PY

          rm -f .github/workflows/patch-shortcuts-import-health.yml

      - name: Verify and build debug APK
        run: gradle clean test lint assembleDebug assembleRelease --stacktrace

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Run shortcuts in background and harden backup import"
          git push origin HEAD:feature/background-dedup-timeouts

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drive-time-notifier-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
